[project]
name = "autonomous-api-tester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepak kumar Kella", email = "kellakdk@gamil.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
autonomous-api-tester = "autonomous_api_tester:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
